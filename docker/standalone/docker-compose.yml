# Wiziki avec Docker Compose. Mode d'emploi complet : docs/installation.md
#   docker compose up -d          puis ouvrir http://localhost:3100
#   docker compose logs wiziki    pour lire le jeton d'installation (premier démarrage)
services:
  wiziki:
    image: ghcr.io/wiziki-org/wiziki:1     # version 1.x la plus récente (mise à jour : docker compose pull && docker compose up -d)
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"              # accessible depuis cette machine ; pour Internet, passer par un reverse proxy HTTPS
    environment:
      # Facultatif : crée le compte « admin » au premier démarrage. Sans lui : écran d'installation (jeton dans les journaux)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TRUST_PROXY=1
    volumes:
      - wiziki-data:/data                  # base SQLite, images, sauvegardes automatiques

volumes:
  wiziki-data:
